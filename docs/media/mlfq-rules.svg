<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2430; }
    .dim { fill: #5d6575; }
    .lane { fill: #f3f5f8; stroke: #d5dae3; }
    .stroke { stroke: #1f2430; }
    .cpu { fill: #eef3ff; stroke: #4c6fd1; }
    .card { fill: #fafbfc; stroke: #d5dae3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1218; }
      .ink { fill: #e6e8ec; }
      .dim { fill: #9aa3b2; }
      .lane { fill: #1a1f28; stroke: #2e3543; }
      .stroke { stroke: #e6e8ec; }
      .cpu { fill: #182238; stroke: #7aa7ff; }
      .card { fill: #151920; stroke: #2e3543; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="460" rx="14"/>

  <text class="ink" x="30" y="40" font-size="20" font-weight="700">How a process moves between levels</text>
  <text class="dim" x="30" y="62" font-size="13">Three ready queues, highest priority on top. The CPU always takes the front of the highest non-empty queue.</text>

  <!-- lanes -->
  <g font-size="13">
    <rect class="lane" x="150" y="95" width="360" height="62" rx="10"/>
    <rect x="150" y="95" width="6" height="62" rx="3" fill="#3fb68b"/>
    <text x="170" y="122" font-weight="700" fill="#3fb68b" font-size="16">L0</text>
    <text class="dim" x="170" y="142">quantum 1</text>

    <rect class="lane" x="150" y="185" width="360" height="62" rx="10"/>
    <rect x="150" y="185" width="6" height="62" rx="3" fill="#e0a93b"/>
    <text x="170" y="212" font-weight="700" fill="#e0a93b" font-size="16">L1</text>
    <text class="dim" x="170" y="232">quantum 2</text>

    <rect class="lane" x="150" y="275" width="360" height="62" rx="10"/>
    <rect x="150" y="275" width="6" height="62" rx="3" fill="#e0664f"/>
    <text x="170" y="302" font-weight="700" fill="#e0664f" font-size="16">L2</text>
    <text class="dim" x="170" y="322">quantum 4</text>

    <rect class="lane" x="150" y="375" width="360" height="56" rx="10"/>
    <rect x="150" y="375" width="6" height="56" rx="3" fill="#6f86d6"/>
    <text x="170" y="400" font-weight="700" fill="#6f86d6" font-size="16">I/O</text>
    <text class="dim" x="170" y="419">blocked, FIFO</text>
  </g>

  <!-- tokens -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="290" cy="126" r="17" fill="#5ad1e6"/><text x="290" y="130" fill="#0d1016">P3</text>
    <circle cx="335" cy="126" r="17" fill="#f78fb3"/><text x="335" y="130" fill="#0d1016">P4</text>
    <circle cx="290" cy="216" r="17" fill="#c792ea"/><text x="290" y="220" fill="#0d1016">P2</text>
    <circle cx="290" cy="306" r="17" fill="#7aa7ff"/><text x="290" y="310" fill="#0d1016">P1</text>
    <circle cx="290" cy="403" r="17" fill="#b5e655"/><text x="290" y="407" fill="#0d1016">P5</text>
  </g>

  <!-- new arrival -->
  <text class="ink" x="150" y="86" font-size="12.5" font-weight="600">new process joins L0</text>

  <!-- CPU -->
  <rect class="cpu" x="570" y="95" width="120" height="62" rx="10" stroke-width="2"/>
  <text class="ink" x="630" y="122" font-size="15" font-weight="700" text-anchor="middle">CPU</text>
  <text class="dim" x="630" y="142" font-size="12" text-anchor="middle">1 tick at a time</text>
  <path d="M355 126 H 564" class="stroke" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text class="dim" x="440" y="118" font-size="12" text-anchor="middle">dispatch</text>

  <!-- demote: CPU back down into the next queue -->
  <path d="M600 160 C 600 200, 560 216, 516 216" stroke="#e0664f" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M530 222 C 548 250, 548 280, 516 300" stroke="#e0664f" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="556" y="262" font-size="12" font-weight="700" fill="#e0664f">demote</text>
  <!-- block: CPU down to I/O -->
  <path d="M665 160 V 403 H 516" stroke="#6f86d6" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="673" y="300" font-size="12" font-weight="700" fill="#6f86d6">blocks</text>
  <!-- I/O done, rejoin (promoted) level -->
  <path d="M150 403 C 104 400, 104 236, 145 222" stroke="#6f86d6" stroke-width="2.5" fill="none" marker-end="url(#ar)" stroke-dasharray="6 4"/>
  <text x="96" y="330" font-size="12" fill="#6f86d6" text-anchor="end">I/O done:</text>
  <text x="96" y="346" font-size="12" fill="#6f86d6" text-anchor="end">rejoin one</text>
  <text x="96" y="362" font-size="12" fill="#6f86d6" text-anchor="end">level higher</text>
  <!-- boost -->
  <path d="M150 300 C 60 290, 60 140, 145 130" stroke="#7aa7ff" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="54" y="200" font-size="12" font-weight="700" fill="#7aa7ff" text-anchor="end">boost</text>
  <text x="54" y="216" font-size="12" fill="#7aa7ff" text-anchor="end">all to L0</text>

  <!-- rule cards -->
  <g font-size="12.5">
    <rect class="card" x="715" y="95" width="225" height="76" rx="10"/>
    <circle cx="733" cy="115" r="6" fill="#e0664f"/>
    <text class="ink" x="747" y="119" font-weight="700">Used the whole quantum</text>
    <text class="dim" x="733" y="139">looks CPU-bound: demote one</text>
    <text class="dim" x="733" y="157">level (L2 is the floor)</text>

    <rect class="card" x="715" y="185" width="225" height="76" rx="10"/>
    <circle cx="733" cy="205" r="6" fill="#6f86d6"/>
    <text class="ink" x="747" y="209" font-weight="700">Blocked for I/O</text>
    <text class="dim" x="733" y="229">looks interactive: promote one</text>
    <text class="dim" x="733" y="247">level, then wait for the device</text>

    <rect class="card" x="715" y="275" width="225" height="76" rx="10"/>
    <circle cx="733" cy="295" r="6" fill="#7aa7ff"/>
    <text class="ink" x="747" y="299" font-weight="700">Priority boost every N ticks</text>
    <text class="dim" x="733" y="319">every process back to L0, so</text>
    <text class="dim" x="733" y="337">nothing starves at the bottom</text>

    <rect class="card" x="715" y="365" width="225" height="66" rx="10"/>
    <circle cx="733" cy="385" r="6" fill="#3fb68b"/>
    <text class="ink" x="747" y="389" font-weight="700">Last tick used</text>
    <text class="dim" x="733" y="409">terminates, even if a block or</text>
    <text class="dim" x="733" y="425">preempt would also be due</text>
  </g>
</svg>
